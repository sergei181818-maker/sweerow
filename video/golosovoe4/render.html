<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ===================== core =====================
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let TL = null, SCENES = [], WORDS = [], CHUNKS = [], EVENTS = [];

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => (k = clamp(k), k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
const backOut = k => { k = clamp(k); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function rng(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

function setup(timeline) {
  TL = timeline;
  // scenes = contiguous lines with same scene id
  SCENES = [];
  TL.lines.forEach((ln, i) => {
    const last = SCENES[SCENES.length - 1];
    if (last && last.id === ln.scene) last.lines.push(ln);
    else SCENES.push({ id: ln.scene, lines: [ln] });
  });
  SCENES.forEach((s, i) => {
    s.start = i === 0 ? 0 : s.lines[0].start - 0.12;
    s.end = i < SCENES.length - 1 ? SCENES[i + 1].lines[0].start - 0.12 : TL.duration;
  });
  // words with proportional timing
  WORDS = [];
  TL.lines.forEach((ln, li) => {
    const ws = ln.sub.split(/\s+/).filter(Boolean);
    const weights = ws.map(w => w.replace(/[^\p{L}\p{N}]/gu, '').length + 2.5);
    const tot = weights.reduce((a, b) => a + b, 0);
    let t = ln.start;
    ws.forEach((w, k) => {
      const d = (ln.end - ln.start) * weights[k] / tot;
      WORDS.push({ w, s: t, e: t + d, li });
      t += d;
    });
  });
  // chunks of words (max ~15 chars, max 3 words), break on punctuation / line end
  CHUNKS = [];
  let cur = [];
  WORDS.forEach((wd, i) => {
    const len = cur.reduce((a, x) => a + x.w.length + 1, 0);
    if (cur.length && (cur[0].li !== wd.li || len + wd.w.length > 16 || cur.length >= 3)) { CHUNKS.push(cur); cur = []; }
    cur.push(wd);
    if (/[.,:!?»—]$/.test(wd.w) && wd.w.length > 1) { CHUNKS.push(cur); cur = []; }
  });
  if (cur.length) CHUNKS.push(cur);
  CHUNKS.forEach((c, i) => {
    c.s = c[0].s; c.e = c[c.length - 1].e;
    const nx = CHUNKS[i + 1];
    c.hold = nx && nx[0].li === c[0].li ? nx[0].s : c.e + 0.25;
  });
  // events for sound design
  EVENTS = [];
  SCENES.forEach((s, i) => { if (i > 0) EVENTS.push({ type: 'whoosh', t: s.start - 0.25 }); EVENTS.push({ type: 'boom', t: s.start, soft: i > 0 }); });
  stampTimes().forEach(t => EVENTS.push({ type: 'stamp', t }));
  const y = SCENES.find(s => s.id === 'years');
  if (y) { for (let yr = 1945; yr <= 1974; yr++) EVENTS.push({ type: 'tick', t: yearTime(y, yr) }); }
  const sz = SCENES.find(s => s.id === 'suzuki');
  if (sz) { const l = sz.lines[1]; [0.42, 0.64, 0.86].forEach(k => EVENTS.push({ type: 'pop', t: lerp(l.start, l.end, k) })); EVENTS.push({ type: 'ding', t: sz.lines[2].start + 0.5 }); }
  if (typeof extraEvents === 'function') EVENTS.push(...extraEvents());
  return { scenes: SCENES.map(s => ({ id: s.id, start: s.start, end: s.end })), events: EVENTS.sort((a, b) => a.t - b.t), chunks: CHUNKS.length };
}
const sc = id => SCENES.find(s => s.id === id);
function stampTimes() {
  const out = [];
  const h = sc('hook'); if (h) out.push(h.start + 1.05);
  const o = sc('order'); if (o) out.push(o.lines[1].start + 0.05);
  const c = sc('command'); if (c) out.push(c.lines[1].end - 0.9);
  const f = sc('final'); if (f) out.push(f.lines[1].start + 1.2);
  return out;
}
function yearTime(s, yr) {
  // years accelerate across scene
  const k = (yr - 1945) / 29;
  const p = Math.pow(k, 0.62);
  return lerp(s.start + 0.3, s.end - 0.4, p);
}

// ===================== palettes / helpers =====================
function grad(y0, y1, stops) { const g = ctx.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function rgrad(x, y, r0, r1, stops) { const g = ctx.createRadialGradient(x, y, r0, x, y, r1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function sky(top, bot) { ctx.fillStyle = grad(0, H, [[0, top], [1, bot]]); ctx.fillRect(-200, -200, W + 400, H + 400); }

// Procedural jungle silhouette layers
const LEAVES = {};
function jungleLayer(seed, baseY, color, amp, density, t, drift) {
  const key = seed + '_' + baseY;
  if (!LEAVES[key]) {
    const r = rng(seed); const items = [];
    for (let i = 0; i < density; i++) {
      items.push({ x: -200 + r() * (W + 400), h: amp * (0.5 + r() * 0.9), type: r() < 0.55 ? 'palm' : 'fern', a: (r() - .5) * 0.5, ph: r() * 6.28, n: 5 + Math.floor(r() * 5) });
    }
    LEAVES[key] = items;
  }
  ctx.save();
  ctx.fillStyle = color; ctx.strokeStyle = color;
  ctx.translate(drift || 0, 0);
  // ground mass
  ctx.beginPath(); ctx.moveTo(-300, H + 50);
  for (let x = -300; x <= W + 300; x += 60) ctx.lineTo(x, baseY + Math.sin(x * 0.011 + seed) * amp * 0.12);
  ctx.lineTo(W + 300, H + 50); ctx.closePath(); ctx.fill();
  LEAVES[key].forEach(it => {
    const sway = Math.sin(t * 1.3 + it.ph) * 0.04;
    ctx.save(); ctx.translate(it.x, baseY + 10); ctx.rotate(it.a * 0.3 + sway);
    if (it.type === 'palm') {
      // trunk
      ctx.lineWidth = 14; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(it.h * 0.15, -it.h * 0.5, it.h * 0.08, -it.h); ctx.stroke();
      ctx.translate(it.h * 0.08, -it.h);
      for (let k = 0; k < it.n; k++) {
        const ang = -Math.PI / 2 + (k - (it.n - 1) / 2) * 0.62 + sway * 2;
        leaf(ang, it.h * 0.55, it.h * 0.09);
      }
    } else {
      for (let k = 0; k < it.n; k++) {
        const ang = -Math.PI / 2 + (k - (it.n - 1) / 2) * 0.33 + sway;
        leaf(ang, it.h * 0.6, it.h * 0.07);
      }
    }
    ctx.restore();
  });
  ctx.restore();
}
function leaf(ang, len, wid) {
  ctx.save(); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(len * 0.5, -wid, len, wid * 0.6);
  ctx.quadraticCurveTo(len * 0.5, wid * 0.9, 0, 0);
  ctx.fill(); ctx.restore();
}

// Soldier silhouette (feet at 0,0), height ~ 560*s
function soldier(x, y, s, color, opts = {}) {
  const t = opts.t || 0, walk = opts.walk || 0;
  ctx.save(); ctx.translate(x, y); ctx.scale(s * (opts.flip ? -1 : 1), s);
  ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (opts.rim !== false) { ctx.shadowColor = opts.rim || 'rgba(170,230,255,0.6)'; ctx.shadowBlur = 36; }
  const sw = Math.sin(t * 6) * 22 * walk;
  const bob = Math.abs(Math.sin(t * 6)) * 8 * walk + Math.sin(t * 1.6) * 3;
  // legs
  ctx.lineWidth = 46;
  ctx.beginPath(); ctx.moveTo(-18, -250 - bob); ctx.lineTo(-22 + sw, -20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(18, -250 - bob); ctx.lineTo(22 - sw, -20); ctx.stroke();
  // boots
  ctx.beginPath(); ctx.ellipse(-14 + sw, -12, 34, 16, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(30 - sw, -12, 34, 16, 0, 0, Math.PI * 2); ctx.fill();
  ctx.translate(0, -bob);
  // rifle behind (diagonal over right shoulder)
  ctx.save(); ctx.lineWidth = 12;
  ctx.beginPath(); ctx.moveTo(-70, -170); ctx.lineTo(95, -560); ctx.stroke();
  ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(95, -560); ctx.lineTo(118, -615); ctx.stroke();
  ctx.lineWidth = 22; ctx.beginPath(); ctx.moveTo(-70, -170); ctx.lineTo(-40, -240); ctx.stroke();
  ctx.restore();
  // torso
  ctx.beginPath(); ctx.moveTo(-62, -440); ctx.quadraticCurveTo(-78, -330, -52, -240); ctx.lineTo(52, -240); ctx.quadraticCurveTo(78, -330, 62, -440);
  ctx.quadraticCurveTo(0, -470, -62, -440); ctx.fill();
  // backpack bump
  ctx.beginPath(); ctx.ellipse(-58, -360, 26, 62, 0.1, 0, Math.PI * 2); ctx.fill();
  // arms
  ctx.lineWidth = 34;
  const as = Math.sin(t * 6) * 16 * walk;
  ctx.beginPath(); ctx.moveTo(-56, -425); ctx.lineTo(-70 - as, -320); ctx.lineTo(-62 - as, -230); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(56, -425); ctx.lineTo(74 + as, -330); ctx.lineTo(40, -300); ctx.stroke();
  // neck + head
  ctx.lineWidth = 30; ctx.beginPath(); ctx.moveTo(0, -450); ctx.lineTo(0, -478); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, -515, 40, 46, 0, 0, Math.PI * 2); ctx.fill();
  // field cap with neck flaps
  ctx.beginPath(); ctx.ellipse(0, -545, 46, 28, 0, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.moveTo(30, -538); ctx.lineTo(78, -530); ctx.lineTo(34, -524); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-44, -540); ctx.lineTo(-58, -470); ctx.lineTo(-36, -478); ctx.lineTo(-28, -520); ctx.fill();
  ctx.restore();
}

// generic civilian silhouette (student / officer)
function person(x, y, s, color, kind, t, rim) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineCap = 'round';
  ctx.shadowColor = rim || 'rgba(255,210,160,0.55)'; ctx.shadowBlur = 36;
  const b = Math.sin(t * 1.7) * 3;
  ctx.lineWidth = 44;
  ctx.beginPath(); ctx.moveTo(-20, -250); ctx.lineTo(-24, -20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(20, -250); ctx.lineTo(26, -20); ctx.stroke();
  ctx.translate(0, b);
  ctx.beginPath(); ctx.moveTo(-64, -440); ctx.quadraticCurveTo(-80, -330, -56, -230); ctx.lineTo(56, -230); ctx.quadraticCurveTo(80, -330, 64, -440); ctx.quadraticCurveTo(0, -470, -64, -440); ctx.fill();
  ctx.lineWidth = 32;
  ctx.beginPath(); ctx.moveTo(-58, -425); ctx.lineTo(-74, -320); ctx.lineTo(-66, -235); ctx.stroke();
  if (kind === 'officer') { ctx.beginPath(); ctx.moveTo(58, -425); ctx.lineTo(80, -340); ctx.lineTo(30, -330); ctx.stroke(); }
  else { ctx.beginPath(); ctx.moveTo(58, -425); ctx.lineTo(74, -320); ctx.lineTo(66, -235); ctx.stroke(); }
  ctx.lineWidth = 30; ctx.beginPath(); ctx.moveTo(0, -450); ctx.lineTo(0, -478); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, -515, 40, 46, 0, 0, Math.PI * 2); ctx.fill();
  if (kind === 'student') {
    // backpack + messy hair
    ctx.beginPath(); ctx.roundRect(-118, -440, 70, 170, 22); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, -545, 50, 30, 0, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-30, -520, 22, 34, 0.3, 0, Math.PI * 2); ctx.fill();
  } else {
    // officer cap
    ctx.beginPath(); ctx.ellipse(0, -556, 52, 18, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(-40, -560, 80, 22);
    ctx.beginPath(); ctx.moveTo(30, -540); ctx.lineTo(70, -532); ctx.lineTo(30, -530); ctx.fill();
  }
  ctx.restore();
}

function stamp(text, x, y, k, color, rot, size) {
  if (k <= 0) return;
  const s = lerp(2.4, 1, backOut(k * 1.6));
  const a = clamp(k * 5);
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s); ctx.globalAlpha = a;
  ctx.font = `900 ${size}px Inter`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(text).width + size * 0.7, h = size * 1.35;
  ctx.strokeStyle = color; ctx.lineWidth = size * 0.09;
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, size * 0.12); ctx.stroke();
  ctx.lineWidth = size * 0.035; ctx.beginPath(); ctx.roundRect(-w / 2 + size * 0.12, -h / 2 + size * 0.12, w - size * 0.24, h - size * 0.24, size * 0.08); ctx.stroke();
  ctx.fillStyle = color; ctx.fillText(text, 0, size * 0.04);
  // ink texture: erase some specks
  ctx.globalCompositeOperation = 'destination-out';
  const r = rng(text.length * 77);
  for (let i = 0; i < 45; i++) { ctx.beginPath(); ctx.arc((r() - .5) * w, (r() - .5) * h, r() * size * 0.022, 0, 6.3); ctx.fill(); }
  ctx.restore();
}

function label(text, x, y, size, color, alpha = 1, weight = 800, spacing = 0) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.font = `${weight} ${size}px Inter`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (spacing) ctx.letterSpacing = spacing + 'px';
  ctx.fillStyle = color; ctx.fillText(text, x, y); ctx.restore();
}

function glow(x, y, r, color, a) { ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = rgrad(x, y, 0, r, [[0, color], [1, 'rgba(0,0,0,0)']]); ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore(); }

function fireflies(t, n, seed, color) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const bx = r() * W, by = 600 + r() * 1100, ph = r() * 6.28, sp = 0.3 + r() * 0.6;
    const x = bx + Math.sin(t * sp + ph) * 40, y = by + Math.cos(t * sp * 0.8 + ph) * 30;
    const a = 0.4 + 0.6 * Math.max(0, Math.sin(t * 2 * sp + ph));
    glow(x, y, 18, color, a * 0.8);
  }
}

// ===================== scenes =====================
const S = {};

S.hook = (u, s, t) => {
  sky('#05121a', '#0c2a2a');
  glow(860, 250, 380, 'rgba(190,230,255,0.35)', 1);
  ctx.fillStyle = '#e8f6ff'; ctx.beginPath(); ctx.arc(860, 250, 70, 0, 7); ctx.fill();
  jungleLayer(3, 1150, '#0b2526', 380, 14, t, -u * 6);
  fireflies(t, 18, 9, 'rgba(200,255,150,0.9)');
  jungleLayer(7, 1450, '#071816', 460, 12, t, -u * 14);
  soldier(540, 1640, 1.05, '#020807', { t });
  jungleLayer(11, 1900, '#010605', 240, 7, t, -u * 26);
  const k = (t - (s.start + 1.05)) / 0.5;
  stamp('29 ЛЕТ', 540, 470, k, '#ff3b30', -0.08, 150);
  const y2 = s.lines[1].start;
  label('1945 → 1974', 540, 650, 64, '#ffffff', clamp((t - y2) * 3) * 0.9, 800, 4);
};

S.island = (u, s, t) => {
  sky('#062a44', '#0b4d6e');
  // waves
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 4;
  for (let row = 0; row < 26; row++) {
    const y = 120 + row * 72; ctx.beginPath();
    for (let x = -40; x <= W + 40; x += 20) ctx.lineTo(x, y + Math.sin(x * 0.02 + t * 1.5 + row) * 8);
    ctx.stroke();
  }
  ctx.restore();
  // islands
  const isl = (x, y, rx, ry, seed, col) => {
    const r = rng(seed); ctx.beginPath();
    for (let a = 0; a <= 6.3; a += 0.25) { const rr = 0.75 + r() * 0.35; ctx.lineTo(x + Math.cos(a) * rx * rr, y + Math.sin(a) * ry * rr); }
    ctx.closePath(); ctx.fillStyle = col; ctx.fill();
  };
  isl(720, 520, 260, 340, 5, '#2f6b4f'); isl(860, 1180, 180, 260, 6, '#2f6b4f'); isl(300, 1500, 140, 90, 8, '#2f6b4f');
  ctx.save(); ctx.shadowColor = '#ffd60a'; ctx.shadowBlur = 40 * (0.6 + 0.4 * Math.sin(t * 4));
  isl(400, 930, 110, 62, 12, '#4fa36f'); ctx.restore();
  // plane path
  const p = ease(u / 2.6);
  ctx.save(); ctx.setLineDash([22, 18]); ctx.lineDashOffset = -t * 60; ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 6;
  ctx.beginPath();
  const pts = []; for (let k = 0; k <= p; k += 0.01) { const x = lerp(1100, 400, k), y = lerp(200, 930, k) - Math.sin(k * Math.PI) * 220; pts.push([x, y]); }
  pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); ctx.restore();
  // pin
  const pk = (u - 2.4) / 0.5;
  if (pk > 0) {
    const ps = backOut(pk);
    ctx.save(); ctx.translate(400, 900); ctx.scale(ps, ps);
    ctx.fillStyle = '#ff3b30'; ctx.beginPath(); ctx.arc(0, -70, 42, Math.PI, 0); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, -72, 16, 0, 7); ctx.fill(); ctx.restore();
    ctx.save(); ctx.globalAlpha = clamp(pk) * (1 - ((t * 1.2) % 1)); ctx.strokeStyle = '#ff3b30'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(400, 930, 60 + ((t * 1.2) % 1) * 120, 0, 7); ctx.stroke(); ctx.restore();
    label('о. ЛУБАНГ', 400, 1030, 52, '#ffffff', clamp(pk), 900, 3);
    label('ФИЛИППИНЫ', 400, 1085, 34, '#cfe8ff', clamp(pk) * 0.85, 700, 6);
  }
  // year big
  const yk = clamp((t - s.lines[0].start) * 2.5);
  ctx.save(); ctx.globalAlpha = yk; ctx.font = '900 210px Inter'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.fillText('1944', 540, 330 + (1 - easeOut(yk)) * 60); ctx.restore();
  // plane icon at path head
  if (p < 1) { const x = lerp(1100, 400, p), y = lerp(200, 930, p) - Math.sin(p * Math.PI) * 220; plane(x, y, 0.9, Math.atan2(730, -700), '#ffffff'); }
};
function plane(x, y, s, ang, col) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s); ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(0, 0, 70, 14, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-20, -80); ctx.lineTo(-38, -80); ctx.lineTo(-18, 0); ctx.lineTo(-38, 80); ctx.lineTo(-20, 80); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-56, 0); ctx.lineTo(-70, -30); ctx.lineTo(-78, -30); ctx.lineTo(-70, 0); ctx.lineTo(-78, 30); ctx.lineTo(-70, 30); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function paper(x, y, w, h, rot, tint) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 30;
  ctx.fillStyle = tint || '#efe3c6'; ctx.fillRect(-w / 2, -h / 2, w, h);
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = rgrad(0, 0, w * 0.2, w * 0.9, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(90,60,20,0.35)']]); ctx.fillRect(-w / 2, -h / 2, w, h);
  ctx.restore();
}

S.order = (u, s, t) => {
  sky('#1a120c', '#2b1d12');
  glow(540, 760, 900, 'rgba(255,190,110,0.25)', 1);
  const rot = -0.03 + Math.sin(t * 0.7) * 0.004;
  paper(540, 820, 820, 1000, rot);
  ctx.save(); ctx.translate(540, 820); ctx.rotate(rot);
  ctx.fillStyle = '#2a1a0e'; ctx.textAlign = 'center';
  ctx.font = '900 78px Inter'; ctx.fillText('ПРИКАЗ', 0, -360);
  ctx.font = '600 30px JetBrains Mono'; ctx.fillText('Императорская армия Японии · 1944', 0, -300);
  ctx.fillRect(-330, -270, 660, 4);
  const lines = ['Лейтенанту Х. Оноде:', '', '— вести партизанскую войну', '— не сдаваться в плен', '— не лишать себя жизни', '', 'Мы вернёмся за тобой.'];
  const all = lines.join('\n'); const shown = Math.floor(clamp(u / 2.2) * all.length);
  let cnt = 0; ctx.textAlign = 'left'; ctx.font = '500 40px JetBrains Mono';
  lines.forEach((ln, i) => {
    const vis = ln.slice(0, Math.max(0, shown - cnt)); cnt += ln.length + 1;
    ctx.fillText(vis, -330, -190 + i * 66);
  });
  ctx.restore();
  stamp('НИКОГДА', 560, 1050, (t - (s.lines[1].start + 0.05)) / 0.45, '#d0021b', -0.14, 120);
};

S.end45 = (u, s, t) => {
  const l2 = s.lines[1].start;
  if (t < l2 - 0.15) {
    sky('#d9d4c7', '#bdb5a3');
    // spinning newspaper
    const k = easeOut(u / 0.9);
    ctx.save(); ctx.translate(540, 880); ctx.rotate((1 - k) * 6.5 - 0.05); ctx.scale(0.2 + 0.8 * k, 0.2 + 0.8 * k);
    paper(0, 0, 900, 1180, 0, '#f4f0e6');
    ctx.fillStyle = '#111'; ctx.textAlign = 'center';
    ctx.font = '900 50px DejaVu Serif'; ctx.fillText('ВЕСТИ МИРА', 0, -500);
    ctx.fillRect(-400, -470, 800, 6);
    ctx.font = '700 30px DejaVu Serif'; ctx.fillText('15 АВГУСТА 1945', 0, -425);

// ===================== scenes: Tilly Smith (2004) =====================
// Flat 2D toon characters with faces + emotions.
const SKIN = '#f3c9a4', SKIN_D = '#d9a57f', OUT = 'rgba(40,25,20,0.9)';

// feet at (x,y). o: {shirt, pants, hair, style:'girl'|'mom'|'dad'|'guard'|'teacher'|'kid', emo, look, t, run, talk, flip, arm}
function toon(x, y, s, o) {
  const t = o.t || 0, emo = o.emo || 'happy';
  ctx.save(); ctx.translate(x, y); ctx.scale(s * (o.flip ? -1 : 1), s);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const run = o.run || 0;
  const ph = t * (run ? 11 : 0);
  const bob = run ? Math.abs(Math.sin(ph)) * 14 : Math.sin(t * 2) * 3;
  // legs
  ctx.strokeStyle = o.pants || '#3b4a6b'; ctx.lineWidth = 34;
  const l1 = Math.sin(ph) * 40 * run, l2 = -l1;
  ctx.beginPath(); ctx.moveTo(-22, -175); ctx.lineTo(-22 + l1, -20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(22, -175); ctx.lineTo(22 + l2, -20); ctx.stroke();
  ctx.fillStyle = '#2b2b33';
  ctx.beginPath(); ctx.ellipse(-22 + l1 + 8, -12, 26, 13, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(22 + l2 + 8, -12, 26, 13, 0, 0, 7); ctx.fill();
  ctx.translate(0, -bob);
  // arms
  const a = o.arm || (run ? 'run' : 'down');
  const arm = (side, kind) => {
    const sx = side * 58, sy = -340;
    let ex, ey, hx, hy;
    if (kind === 'up') { ex = side * 90; ey = -430; hx = side * 100; hy = -520 + Math.sin(t * 9) * 12; }
    else if (kind === 'point') { ex = side * 120; ey = -350; hx = side * 190; hy = -370; }
    else if (kind === 'run') { const k = Math.sin(ph + (side > 0 ? 0 : Math.PI)); ex = side * 70 + k * 30; ey = -280; hx = side * 60 + k * 55; hy = -220; }
    else if (kind === 'mouth') { ex = side * 85; ey = -300; hx = side * 40; hy = -420; }
    else { ex = side * 72; ey = -270; hx = side * 70; hy = -200; }
    ctx.strokeStyle = o.shirt; ctx.lineWidth = 30;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = SKIN; ctx.lineWidth = 24;
    ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.fillStyle = SKIN; ctx.beginPath(); ctx.arc(hx, hy, 16, 0, 7); ctx.fill();
  };
  const [aL, aR] = Array.isArray(a) ? a : [a, a];
  arm(-1, aL);
  // torso
  ctx.fillStyle = o.shirt; ctx.strokeStyle = OUT; ctx.lineWidth = 5;
  ctx.beginPath();
  if (o.style === 'girl' || o.style === 'mom') { ctx.moveTo(-58, -365); ctx.lineTo(58, -365); ctx.lineTo(80, -170); ctx.lineTo(-80, -170); }
  else { ctx.roundRect(-62, -370, 124, 205, 30); }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  if (o.style === 'guard') { ctx.fillStyle = '#ffd60a'; ctx.fillRect(-62, -300, 124, 22); }
  arm(1, aR);
  // neck + head
  ctx.fillStyle = SKIN; ctx.fillRect(-16, -395, 32, 34);
  face(0, -480, 1, o, t, emo);
  ctx.restore();
}

function face(x, y, s, o, t, emo) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const look = (o.look || 0) * 10;
  const st = o.style;
  // back hair
  ctx.fillStyle = o.hair || '#5a3b28';
  if (st === 'girl') { // pigtails
    ctx.beginPath(); ctx.ellipse(-112, 10, 30, 52, 0.4 + Math.sin(t * 6) * 0.08, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(112, 10, 30, 52, -0.4 - Math.sin(t * 6) * 0.08, 0, 7); ctx.fill();
  }
  if (st === 'mom') { ctx.beginPath(); ctx.roundRect(-108, -60, 216, 190, 60); ctx.fill(); }
  // head
  ctx.fillStyle = SKIN; ctx.strokeStyle = OUT; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.ellipse(0, 0, 100, 108, 0, 0, 7); ctx.fill(); ctx.stroke();
  // ears

  const blink = (Math.sin(t * 1.3 + (o.seed || 0)) > 0.985) ? 0.1 : 1;

  if (emo === 'shut') { ctx.strokeStyle = '#2a1c16'; ctx.lineWidth = 7; [-38, 38].forEach(ex => { ctx.beginPath(); ctx.moveTo(ex - 20, -6); ctx.lineTo(ex + 4 * Math.sign(ex), 4); ctx.lineTo(ex - 20, 14); ctx.stroke(); }); }

  });

function bubble(text, x, y, k, tail) {

  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 40); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo((tail || 0) - 20, h / 2 - 4); ctx.lineTo((tail || 0) + 10, h / 2 + 46); ctx.lineTo((tail || 0) + 24, h / 2 - 4); ctx.fill();
  ctx.fillStyle = '#111'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 0, 4);
  ctx.restore();
}

// Beach world. recede 0..1 (sea goes away), storm 0..1 (dark), wave 0..1 (wall of water)
function beach(t, recede, storm, cam) {
  const c = (a, b) => `rgb(${lerp(a[0], b[0], storm)|0},${lerp(a[1], b[1], storm)|0},${lerp(a[2], b[2], storm)|0})`;
  sky(c([120, 200, 245], [60, 70, 90]), c([255, 226, 190], [120, 120, 130]));
  // sun
  if (storm < 0.8) { glow(820, 300, 300, `rgba(255,240,180,${0.8 * (1 - storm)})`, 1); ctx.fillStyle = `rgba(255,224,102,${1 - storm})`; ctx.beginPath(); ctx.arc(820, 300, 80, 0, 7); ctx.fill(); }
  // sea
  const horizon = 640, shore = lerp(1060, 760, ease(recede));
  ctx.fillStyle = grad(horizon, shore, [[0, c([40, 120, 190], [40, 60, 80])], [1, c([70, 190, 210], [60, 90, 100])]]);
  ctx.fillRect(-200, horizon, W + 400, shore - horizon);
  // sparkles
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  const r = rng(5); for (let i = 0; i < 40; i++) { const sx = r() * W, sy = horizon + r() * (shore - horizon); const a = Math.sin(t * 3 + i) > 0.6; if (a) ctx.fillRect(sx, sy, 26, 4); }
  // foam line (bubbling when receding)
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  for (let x = -40; x < W + 40; x += 34) { const fy = shore + Math.sin(x * 0.05 + t * 3) * 6; ctx.beginPath(); ctx.arc(x, fy, 14 + (recede > 0 ? Math.abs(Math.sin(t * 9 + x)) * 10 : 0), 0, 7); ctx.fill(); }
  // wet sand exposed
  ctx.fillStyle = c([196, 170, 120], [120, 110, 90]); ctx.fillRect(-200, shore + 8, W + 400, 1080 - shore);
  // dry sand
  ctx.fillStyle = grad(1060, H, [[0, c([240, 212, 160], [150, 140, 120])], [1, c([226, 190, 135], [120, 110, 95])]]); ctx.fillRect(-200, 1060, W + 400, H);
  // exposed rocks/fish
  if (recede > 0.3) {
    const r2 = rng(9);
    for (let i = 0; i < 10; i++) {
      const fx = r2() * W, fy = shore + 40 + r2() * (1040 - shore - 60); if (fy > 1050) continue;
      ctx.fillStyle = 'rgba(90,80,70,0.7)'; ctx.beginPath(); ctx.ellipse(fx, fy, 30 + r2() * 30, 12, 0, 0, 7); ctx.fill();
      const fl = Math.sin(t * 12 + i) * 0.4;
      ctx.save(); ctx.translate(fx + 60, fy - 10); ctx.rotate(fl); ctx.fillStyle = '#9fb8c8';
      ctx.beginPath(); ctx.ellipse(0, 0, 22, 9, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(-34, -10); ctx.lineTo(-34, 10); ctx.fill(); ctx.restore();
    }
  }
  // palms on sides
  palm(60, 1250, 1.2, t, c([60, 150, 80], [40, 70, 50]));
  palm(1030, 1180, 1.0, t + 2, c([70, 160, 90], [40, 70, 50]));
}
function palm(x, y, s, t, col) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = '#8a6a48'; ctx.lineWidth = 26; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(40, -250, 10, -520); ctx.stroke();
  ctx.translate(10, -520); ctx.fillStyle = col;
  for (let k = 0; k < 7; k++) leaf(-Math.PI / 2 + (k - 3) * 0.55 + Math.sin(t * 1.5 + k) * 0.05, 260, 40);
  ctx.restore();
}

function hud(t, text, red) {
  ctx.save(); ctx.font = '800 34px Inter'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(text).width + 70;
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.beginPath(); ctx.roundRect(40, 120, w, 64, 32); ctx.fill();
  ctx.fillStyle = red ? (Math.sin(t * 8) > 0 ? '#ff3b30' : '#7a1a15') : '#ffd60a'; ctx.beginPath(); ctx.arc(72, 152, 10, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillText(text, 94, 153); ctx.restore();
}

  ctx.restore();
