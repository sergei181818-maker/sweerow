<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  body { font-family: "Inter", "DejaVu Sans", sans-serif; color: #fff; }
  .abs { position: absolute; }
  .emoji { font-family: "Noto Color Emoji", sans-serif; font-weight: 400; }

  /* ---------- background ---------- */
  #world { position: absolute; inset: -60px; transform-origin: 50% 60%; }
  #sky { position: absolute; inset: 0;
    background: linear-gradient(180deg, #040b18 0%, #0a1f33 38%, #0f3330 62%, #0b2416 100%); }
  .star { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 8px 2px rgba(255,255,255,.6); }
  #moon { position: absolute; left: 700px; top: 250px; width: 170px; height: 170px; border-radius: 50%;
    background: radial-gradient(circle at 38% 38%, #fffbe6 0%, #f3e7b5 55%, #d9c98a 100%);
    box-shadow: 0 0 80px 30px rgba(255,240,180,.35), 0 0 220px 90px rgba(255,240,180,.12); }
  .tree { position: absolute; line-height: 1; transform-origin: 50% 100%; }
  .fog { position: absolute; width: 1400px; height: 420px; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(190,220,215,.22) 0%, rgba(190,220,215,0) 70%);
    filter: blur(20px); }
  .fly { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #fff7a8;
    box-shadow: 0 0 18px 8px rgba(255,240,120,.55); }
  #dark { position: absolute; inset: 0; background: #000; opacity: 0; }
  #vignette { position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,.75) 100%); }
  #redpulse { position: absolute; inset: 0; opacity: 0;
    background: radial-gradient(ellipse at 50% 50%, rgba(255,0,0,0) 40%, rgba(255,20,20,.75) 100%); }
  #flash { position: absolute; inset: 0; background: #ff2a2a; opacity: 0; }

  /* ---------- text helpers ---------- */
  .outline { text-shadow:
      0 6px 0 #000, 5px 5px 0 #000, -5px 5px 0 #000, 5px -5px 0 #000, -5px -5px 0 #000,
      6px 0 0 #000, -6px 0 0 #000, 0 -6px 0 #000, 0 14px 24px rgba(0,0,0,.6); }

  #badge { left: 60px; top: 150px; padding: 14px 30px; border-radius: 999px;
    background: rgba(255,59,48,.92); font-weight: 900; font-size: 40px; letter-spacing: 2px;
    box-shadow: 0 8px 30px rgba(255,59,48,.45); }

  /* hook */
  #hook { left: 0; width: 960px; top: 520px; text-align: center; transform-origin: 50% 50%; }
  #hook .em { font-size: 210px; line-height: 1.1; }
  #hook .big { font-size: 225px; font-weight: 900; line-height: 1; color: #ffe11a; letter-spacing: -6px;
    text-shadow: 0 10px 0 #b30000, 8px 8px 0 #000, -8px 8px 0 #000, 8px -8px 0 #000, -8px -8px 0 #000,
                 0 0 60px rgba(255,40,40,.7); }
  #hook .small { display: inline-block; margin-top: 34px; padding: 18px 34px; background: #ff2d2d;
    font-size: 70px; font-weight: 900; transform: rotate(-3deg); box-shadow: 10px 10px 0 #000; }

  /* situation cards */
  .card { left: 60px; width: 840px; padding: 34px 40px; border-radius: 34px;
    background: rgba(8,16,24,.72); border: 4px solid rgba(255,255,255,.18);
    display: flex; align-items: center; gap: 34px; font-size: 58px; font-weight: 800;
    box-shadow: 0 20px 50px rgba(0,0,0,.5); }
  .card .emoji { font-size: 96px; }

  /* question */
  #question { left: 0; width: 960px; top: 300px; text-align: center; font-size: 96px; font-weight: 900;
    color: #fff; transform-origin: 50% 50%; }
  #question .emoji { display: inline-block; }

  /* options */
  .opt { left: 60px; width: 840px; height: 180px; border-radius: 34px; background: #fff; color: #111;
    display: flex; align-items: center; gap: 26px; padding: 0 30px; font-size: 52px; font-weight: 800;
    box-shadow: 0 14px 0 rgba(0,0,0,.55); transform-origin: 50% 50%; }
  .opt .letter { flex: none; width: 120px; height: 120px; border-radius: 26px; display: grid; place-items: center;
    font-size: 78px; font-weight: 900; color: #fff; box-shadow: inset 0 -8px 0 rgba(0,0,0,.25); }
  .opt .emoji { flex: none; font-size: 70px; }
  .opt .txt { line-height: 1.1; }

  /* timer */
  #timer { left: 370px; top: 1190px; width: 220px; height: 220px; }
  #timer svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  #timer .num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 130px;
    font-weight: 900; color: #ffe11a; }

  /* cta */
  #cta { left: 0; width: 960px; top: 380px; text-align: center; }
  #cta .big { font-size: 104px; font-weight: 900; line-height: 1.05; padding: 0 40px; }
  #cta .letters { margin-top: 50px; display: flex; justify-content: center; gap: 40px; }
  #cta .letters div { width: 190px; height: 190px; border-radius: 40px; display: grid; place-items: center;
    font-size: 130px; font-weight: 900; box-shadow: 0 14px 0 rgba(0,0,0,.55); }
  #cta .point { margin-top: 30px; font-size: 150px; }
  #cta .small { margin-top: 10px; font-size: 54px; font-weight: 800; color: #ffe11a; }
  #sub { left: 230px; top: 1250px; width: 500px; height: 130px; border-radius: 999px; background: #ff2d2d;
    display: flex; align-items: center; justify-content: center; gap: 20px; font-size: 56px; font-weight: 900;
    box-shadow: 0 12px 0 #8c0000, 0 0 60px rgba(255,45,45,.6); }

  /* captions */
  #caps { left: 40px; width: 880px; top: 1440px; height: 200px; display: flex; justify-content: center;
    align-items: center; flex-wrap: wrap; gap: 0 36px; font-size: 92px; font-weight: 900; text-transform: uppercase; }
  #caps span { display: inline-block; transform-origin: 50% 60%; }
  #caps span.on { color: #ffe11a; }
</style>
</head>
<body>
<div id="world">
  <div id="sky"></div>
  <div id="stars"></div>
  <div id="moon"></div>
  <div id="fogs"></div>
  <div id="trees"></div>
  <div id="flies"></div>
</div>
<div id="dark"></div>
<div id="vignette"></div>
<div id="redpulse"></div>
<div id="flash"></div>

<div id="badge" class="abs"></div>
<div id="hook" class="abs"></div>
<div id="sit"></div>
<div id="question" class="abs outline"></div>
<div id="opts"></div>
<div id="timer" class="abs">
  <svg viewBox="0 0 220 220">
    <circle cx="110" cy="110" r="96" fill="rgba(0,0,0,.6)" stroke="rgba(255,255,255,.2)" stroke-width="16"/>
    <circle id="ring" cx="110" cy="110" r="96" fill="none" stroke="#ffe11a" stroke-width="16" stroke-linecap="round"/>
  </svg>
  <div class="num outline"></div>
</div>
<div id="cta" class="abs"></div>
<div id="sub" class="abs"><span class="emoji">🔔</span>ПОДПИШИСЬ</div>
<div id="caps" class="abs outline"></div>

<script>
(() => {
  const TL = window.TL;
  const $ = (s) => document.querySelector(s);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const prog = (t, s, d) => clamp((t - s) / d);
  const outCubic = (x) => 1 - Math.pow(1 - x, 3);
  const inCubic = (x) => x * x * x;
  const outBack = (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  // deterministic pseudo-random so every render is identical
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  const OPT_COLORS = ["#ff8a00", "#00b7ff", "#a64dff"];
  const S = TL.seg;

  // ---------- build background ----------
  const stars = [];
  for (let i = 0; i < 70; i++) {
    const s = el("div", "star"); s.style.left = rnd() * 1200 + "px"; s.style.top = rnd() * 900 + "px";
    const k = 0.4 + rnd() * 0.9; s.style.width = s.style.height = 3 + k * 4 + "px";
    $("#stars").appendChild(s); stars.push({ e: s, sp: 1 + rnd() * 3, ph: rnd() * 6.28 });
  }
  const fogs = [];
  for (let i = 0; i < 3; i++) {
    const f = el("div", "fog"); f.style.top = 1180 + i * 170 + "px"; $("#fogs").appendChild(f);
    fogs.push({ e: f, x0: -400 + rnd() * 300, sp: 12 + rnd() * 18, dir: i % 2 ? -1 : 1 });
  }
  const trees = [];
  const rows = [
    { n: 7, y: 1300, size: [260, 340], b: 0.32 },
    { n: 6, y: 1500, size: [360, 460], b: 0.2 },
    { n: 5, y: 1720, size: [480, 600], b: 0.1 },
  ];
  rows.forEach((r, ri) => {
    for (let i = 0; i < r.n; i++) {
      const t = el("div", "tree emoji", "🌲");
      const sz = r.size[0] + rnd() * (r.size[1] - r.size[0]);
      t.style.fontSize = sz + "px";
      t.style.left = (i / (r.n - 1)) * 1200 - sz / 2 + (rnd() - 0.5) * 80 + "px";
      t.style.top = r.y - sz + "px";
      t.style.filter = `brightness(${r.b}) saturate(.6)`;
      $("#trees").appendChild(t); trees.push({ e: t, ph: rnd() * 6.28, amp: 0.6 + ri * 0.4 });
    }
  });
  const flies = [];
  for (let i = 0; i < 16; i++) {
    const f = el("div", "fly"); $("#flies").appendChild(f);
    flies.push({ e: f, x: 80 + rnd() * 1000, y: 900 + rnd() * 800, ax: 30 + rnd() * 60, ay: 20 + rnd() * 50,
                 sx: 0.3 + rnd() * 0.6, sy: 0.4 + rnd() * 0.7, ph: rnd() * 6.28 });
  }

  // ---------- build foreground ----------
  const ep = TL.episode;
  $("#badge").innerHTML = `<span class="emoji">🔥</span> ${ep.series} #${ep.number}`;
  $("#hook").innerHTML = `<div class="em emoji">${ep.hook.emoji}</div><div class="big">${ep.hook.big}</div><div class="small">${ep.hook.small}</div>`;

  const cards = ep.situation.map((s, i) => {
    const c = el("div", "card abs", `<span class="emoji">${s.emoji}</span><span>${s.text}</span>`);
    c.style.top = 560 + i * 210 + "px"; $("#sit").appendChild(c); return c;
  });

  $("#question").innerHTML = `${ep.question.text} <span class="emoji">${ep.question.emoji}</span>`;
  const qEmoji = $("#question .emoji");

  const opts = ep.options.map((o, i) => {
    const c = el("div", "opt abs",
      `<div class="letter" style="background:${OPT_COLORS[i]}">${o.letter}</div><span class="emoji">${o.emoji}</span><span class="txt">${o.text}</span>`);
    c.style.top = 560 + i * 210 + "px"; $("#opts").appendChild(c); return c;
  });

  const ring = $("#ring"); const C = 2 * Math.PI * 96; ring.style.strokeDasharray = C;
  const num = $("#timer .num");

  $("#cta").innerHTML = `<div class="big outline">${ep.cta.big}</div>
    <div class="letters">${ep.options.map((o, i) => `<div style="background:${OPT_COLORS[i]}" class="outline">${o.letter}</div>`).join("")}</div>
    <div class="point emoji">👇</div>
    <div class="small outline">${ep.cta.small}</div>`;
  const ctaBig = $("#cta .big"), ctaLetters = [...document.querySelectorAll("#cta .letters div")],
        ctaPoint = $("#cta .point"), ctaSmall = $("#cta .small"), sub = $("#sub");

  const caps = $("#caps");
  let lastGroup = -2, lastWord = -2;

  const show = (e, op, tf) => { e.style.opacity = op; e.style.transform = tf || "none"; e.style.visibility = op <= 0.001 ? "hidden" : "visible"; };

  // ---------- per-frame state ----------
  window.seek = (t) => {
    const T = TL.total;
    // background
    $("#world").style.transform = `scale(${1.02 + 0.09 * (t / T)}) translateY(${-20 * (t / T)}px)`;
    stars.forEach((s) => (s.e.style.opacity = 0.25 + 0.75 * Math.abs(Math.sin(t * s.sp + s.ph))));
    fogs.forEach((f) => (f.e.style.transform = `translateX(${f.x0 + f.dir * f.sp * t}px)`));
    trees.forEach((tr) => (tr.e.style.transform = `rotate(${Math.sin(t * 0.9 + tr.ph) * tr.amp}deg)`));
    flies.forEach((f) => {
      f.e.style.transform = `translate(${f.x + Math.sin(t * f.sx + f.ph) * f.ax}px, ${f.y + Math.cos(t * f.sy + f.ph) * f.ay}px)`;
      f.e.style.opacity = 0.3 + 0.7 * Math.abs(Math.sin(t * 1.7 + f.ph * 3));
    });
    $("#dark").style.opacity = 0.5 * outCubic(prog(t, TL.marks.dark, 1.6)) * (1 - prog(t, S.cta.s, 0.6) * 0.6);
    $("#flash").style.opacity = 0.6 * (1 - outCubic(prog(t, 0, 0.45)));

    // hook
    {
      const p = prog(t, 0, 0.35), q = prog(t, S.hook.e, 0.25);
      const shake = Math.sin(t * 70) * 14 * (1 - prog(t, 0, 0.7));
      const sc = (1.12 - 0.12 * outBack(p)) * (1 + 0.025 * Math.sin(t * 9)) * (1 - 0.5 * inCubic(q));
      show($("#hook"), 1 - q, `translateX(${shake}px) scale(${sc})`);
    }

    // situation
    cards.forEach((c, i) => {
      const s = S["sit" + i].s, p = prog(t, s - 0.05, 0.4), q = prog(t, S.question.s - 0.1, 0.3);
      show(c, Math.min(p * 2, 1) * (1 - q),
        `translateX(${(1 - outCubic(p)) * -760}px) rotate(${(1 - outCubic(p)) * -8}deg) translateY(${-220 * inCubic(q)}px)`);
    });

    // question (stays until CTA)
    {
      const p = prog(t, S.question.s - 0.05, 0.35), q = prog(t, S.cta.s - 0.1, 0.25);
      show($("#question"), clamp(p * 3) * (1 - q), `scale(${(0.3 + 0.7 * outBack(p)) * (1 - 0.3 * q)})`);
      qEmoji.style.transform = `rotate(${Math.sin(t * 5) * 12}deg)`;
    }

    // options
    const ts = S.timer.count_start, te = S.timer.count_end;
    opts.forEach((o, i) => {
      const s = S["opt" + i].s, p = prog(t, s - 0.05, 0.35), q = prog(t, S.cta.s - 0.1 + i * 0.06, 0.3);
      const pulse = t > ts && t < te ? 1 + 0.025 * Math.sin((t - ts) * Math.PI * 4 + i) : 1;
      const speaking = t >= s && t < S["opt" + i].e ? 1.03 : 1;
      show(o, clamp(p * 3), `translateY(${(1 - p) * 70}px) scale(${outBack(p) * pulse * speaking}) translateX(${1100 * inCubic(q)}px)`);
    });

    // timer
    {
      const p = prog(t, S.timer.s - 0.05, 0.35), q = prog(t, S.cta.s - 0.1, 0.25);
      show($("#timer"), clamp(p * 3) * (1 - q), `scale(${outBack(p) * (1 - q)})`);
      const n = TL.episode.timer.seconds;
      const el2 = t - ts;
      const digit = el2 < 0 ? n : Math.max(1, n - Math.floor(el2));
      num.textContent = el2 >= n ? "0" : digit;
      const local = el2 < 0 ? 1 : el2 - Math.floor(el2);
      num.style.transform = `scale(${1.5 - 0.5 * outBack(prog(local, 0, 0.25))})`;
      ring.style.strokeDashoffset = C * prog(t, ts, n);
      $("#redpulse").style.opacity = t > ts && t < te + 0.3 ? 0.55 * (1 - outCubic(local)) : 0;
    }

    // CTA
    {
      const s = S.cta.s;
      const p1 = prog(t, s - 0.05, 0.4);
      show(ctaBig, clamp(p1 * 3), `scale(${outBack(p1)}) rotate(${(1 - p1) * -6}deg)`);
      ctaLetters.forEach((L, i) => {
        const p = prog(t, s + 0.25 + i * 0.12, 0.35);
        show(L, clamp(p * 3), `scale(${outBack(p) * (1 + 0.05 * Math.sin(t * 6 + i * 1.3))}) rotate(${Math.sin(t * 3 + i) * 4}deg)`);
      });
      const p3 = prog(t, s + 0.7, 0.3);
      show(ctaPoint, clamp(p3 * 3), `translateY(${Math.abs(Math.sin(t * 7)) * 34}px) scale(${outBack(p3)})`);
      const p4 = prog(t, TL.marks.answer - 0.05, 0.35);
      show(ctaSmall, clamp(p4 * 3), `scale(${outBack(p4)})`);
      const p5 = prog(t, TL.marks.subscribe - 0.05, 0.35);
      show(sub, clamp(p5 * 3), `scale(${outBack(p5) * (1 + 0.04 * Math.sin(t * 8))})`);
    }

    // captions: 2-3 words at a time, current word yellow
    let gi = -1;
    for (let i = 0; i < TL.groups.length; i++) if (t >= TL.groups[i].s && t < TL.groups[i].e) { gi = i; break; }
    if (gi !== lastGroup) {
      caps.innerHTML = gi < 0 ? "" : TL.groups[gi].words.map((w) => `<span>${w.t}</span>`).join("");
      lastGroup = gi; lastWord = -2;
    }
    if (gi >= 0) {
      const g = TL.groups[gi], spans = caps.children;
      let wi = 0;
      g.words.forEach((w, i) => { if (t >= w.s) wi = i; });
      for (let i = 0; i < spans.length; i++) {
        const on = i === wi;
        spans[i].className = on ? "on" : "";
        const pw = prog(t, g.words[i].s, 0.12);
        spans[i].style.transform = on ? `scale(${1.12 - 0.04 * pw})` : "scale(1)";
      }
      const pg = prog(t, g.s, 0.12);
      caps.style.transform = `scale(${0.85 + 0.15 * outBack(pg)})`;
    }
  };

  window.seek(0);
  document.fonts.ready.then(() => { window.ready = true; });
})();
</script>
</body>
</html>
